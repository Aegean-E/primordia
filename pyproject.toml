[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "primordia"
version = "1.0.6"
description = "A zero-dependency evolution sandbox: genomes, selection, speciation and a fossil record"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Assistant" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
primordia = "primordia.cli:main"
